<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Câmara AFO</title>
  <meta name="description" content="Sessões, matérias e vereadores da Câmara Municipal de Alta Floresta D'Oeste, com dados públicos do SAPL.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Câmara AFO">

  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="nav" id="nav">
    <div class="nav-inner">
      <button class="nav-back" id="back" hidden aria-label="Voltar">
        <svg viewBox="0 0 12 21" width="12" height="21" aria-hidden="true"><path d="M10.5 1.5 2 10.5l8.5 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Voltar</span>
      </button>
      <div class="nav-title" id="navTitle"></div>
    </div>
  </header>

  <div class="ptr" id="ptr" aria-hidden="true"><div class="ptr-spin"></div></div>
  <div class="offline" id="offline" hidden>Sem internet · mostrando os últimos dados salvos</div>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" aria-label="Seções">
    <a href="#/hoje" data-tab="hoje">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M4.5 12.6 14 4.8l9.5 7.8V23a1.5 1.5 0 0 1-1.5 1.5h-4.8v-6.8h-6.4v6.8H6A1.5 1.5 0 0 1 4.5 23Z"/></svg>
      <span>Hoje</span></a>
    <a href="#/sessoes" data-tab="sessoes">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M14 3.6 24 9v1.6H4V9Z"/><path d="M6.5 12.4v8.2M11.2 12.4v8.2M16.8 12.4v8.2M21.5 12.4v8.2" class="line"/><path d="M4 21.6h20v2.6H4Z"/></svg>
      <span>Sessões</span></a>
    <a href="#/materias" data-tab="materias">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M8 3.8h8.4l5.6 5.6V22.7A1.5 1.5 0 0 1 20.5 24.2h-12.5A1.5 1.5 0 0 1 6.5 22.7V5.3A1.5 1.5 0 0 1 8 3.8Z"/><path d="M16.2 4v5.6h5.6M10 14h8M10 18h8" class="line"/></svg>
      <span>Matérias</span></a>
    <a href="#/vereadores" data-tab="vereadores">
      <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="10.5" cy="9.6" r="4"/><path d="M3.4 22.5c.6-4 3.4-6.4 7.1-6.4s6.5 2.4 7.1 6.4Z"/><circle cx="19.4" cy="10.6" r="3.2"/><path d="M19.8 16.3c2.9.2 4.8 2.3 5.2 5.4h-5.4"/></svg>
      <span>Vereadores</span></a>
    <a href="#/salvos" data-tab="salvos">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="m14 4 2.9 6.3 6.8.7-5.1 4.6 1.5 6.8L14 18.9l-6.1 3.5 1.5-6.8-5.1-4.6 6.8-.7Z"/></svg>
      <span>Salvos</span><i class="dot" id="dot" hidden></i></a>
  </nav>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="./app.js"></script>
</body>
</html>
